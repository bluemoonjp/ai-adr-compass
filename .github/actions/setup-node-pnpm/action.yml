name: Setup Node and pnpm
description: Install pnpm, set up Node with pnpm's cache, and install this repository's dependencies with a frozen lockfile. Shared by every workflow that needs the toolchain, so they don't drift out of sync with each other.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
